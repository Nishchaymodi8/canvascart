{% include 'header.html' %}
<style>
  .wishlist-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 25px;
    padding: 30px;
  }

  .card {
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    transition: 0.3s;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  .image-box {
    height: 250px;
    overflow: hidden;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
  }

  .card:hover img {
    transform: scale(1.05);
  }

  .card-body {
    padding: 15px;
  }

  .card-body h3 {
    margin: 0;
    font-size: 18px;
  }

  .artist {
    color: gray;
    font-size: 14px;
  }

  .price {
    font-weight: bold;
    margin: 10px 0;
  }

  .actions {
    display: flex;
    justify-content: space-between;
  }

  .btn {
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
  }

  .btn.primary {
    background: black;
    color: white;
  }

  .btn.danger {
    background: #ff4d4d;
    color: white;
  }
  .image-box {
    position: relative;
  }

  .image-box::after {
    content: "View Artwork";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: 0.3s;
  }

  .card:hover .image-box::after {
    opacity: 1;
  }
</style>

<h2 style="margin: 30px">Your Wishlist</h2>

<div class="wishlist-container">
  {% for item in items %}
  <div class="card">
    <div class="image-box">
      <img src="{{ item.artwork.image.url }}" alt="{{ item.artwork.title }}" />
    </div>

    <div class="card-body">
      <h3>{{ item.artwork.title }}</h3>
      <p class="artist">{{ item.artwork.artist }}</p>
      <p class="price">₹ {{ item.artwork.price }}</p>

      <div class="actions">
        <a href="/cart/add/{{ item.artwork.id }}/" class="btn primary"
          >Add to Cart</a
        >
        <a href="{% url 'toggle_wishlist' item.artwork.id %}" class="btn danger"
          >Remove</a
        >
      </div>
    </div>
  </div>
  {% empty %}
  <p style="margin: 30px">No items in wishlist</p>
  {% endfor %}
</div>
{% include 'footer.html' %}
