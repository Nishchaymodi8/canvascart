<head>
  <title>CanvasCart</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    .navbar {
      height: 15vh;
      width: auto;
      border: 1px solid #c6a75e;
      font-family: "Times New Roman", Times, serif;
      font-weight: bolder;
      position: static;
    }
    .logobox {
      border: 1px solid #c6a75e;
      height: 5vh;
      width: 3vw;
      text-align: center;
      font-family: "Times New Roman", Times, serif;
      color: #c6a75e;
      font-size: larger;
      font-weight: lighter;
    }
    #signup_button {
      border: 1px solid black;
      width: 6vw;
      text-align: center;
      color: white;
      background-color: black;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid ms-5">
      <div class="logobox ms-5">CC</div>
      <a class="navbar-brand ms-3 fs-2" href="{% url 'home' %}">Canvascart</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto me-2 fw-light">
          <a class="nav-link me-2" href="{% url 'gallery' %}">Gallery</a>
          {% if request.session.user_id %}
            <a href="{% url 'cart' %}" class="nav-link me-2">
   Cart
     <a href="{% url 'wishlist' %}" class="nav-link me-2"> ❤️</a>
          <a class="nav-link me-2">Welcome, {{ user_name }}</a>

        
          <a href="{% url 'logout' %}" class="nav-link me-2">Logout</a>
          
          {% else %}
          <a class="nav-link me-2" href="{% url 'login' %}">Login</a>
          <a class="nav-link me-2" href="{% url 'signup' %}">Signup</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
</body>
